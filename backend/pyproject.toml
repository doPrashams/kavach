[project]
name = "kavach-backend"
version = "0.1.0"
description = "Kavach self-healing data platform backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "langgraph>=0.4,<2",
    "langchain-core>=1.0,<2",
    "acryl-datahub[datahub-rest]>=1.6.0.8,<1.7",
    "datahub-agent-context[langchain]>=1.6.0.8,<1.7",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9,<1.10",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "mlflow>=2.17,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live DataHub tests (require DATAHUB_GMS_URL)",
]
