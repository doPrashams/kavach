services:
  datahub-gms:
    image: acryldata/datahub-gms:v0.15.0.1
    profiles:
      - datahub
    ports:
      - "8080:8080"
    environment:
      DATAHUB_GMS_HOST: 0.0.0.0
      DATAHUB_GMS_PORT: 8080
      DATAHUB_GMS_USE_KAFKA: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # DataHub MCP Streamable HTTP sidecar (JSON-RPC at http://localhost:8081/mcp).
  # Point Kavach DATAHUB_GMS_URL at this service when exercising live MCP against OSS GMS,
  # or reverse-proxy /mcp onto the GMS host. Cursor uses stdio via repo .cursor/mcp.json.
  mcp-server-datahub:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles:
      - datahub
    ports:
      - "8081:8000"
    environment:
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-http://datahub-gms:8080}
      DATAHUB_GMS_TOKEN: ${DATAHUB_TOKEN:-}
      TOOLS_IS_MUTATION_ENABLED: "true"
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8000"
    command: ["uvx", "mcp-server-datahub@latest", "--transport", "http"]
    depends_on:
      - datahub-gms

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ../data:/app/data:ro
      - ../backend/app/events/recordings:/app/app/events/recordings:ro
      - mlruns:/app/mlruns
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Default openai; set LLM_PROVIDER=stub in deploy/.env for no-key / offline demos.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mlflow_data:
  mlruns:
